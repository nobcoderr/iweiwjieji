name: CCA file-ops Git-metadata live gate

on:
  workflow_dispatch:
    inputs:
      target_branch:
        description: Disposable branch containing the audit symlink
        required: true
        default: cca-live-gate

permissions: {}

jobs:
  preflight:
    name: Redacted Anthropic API preflight
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions: {}
    outputs:
      model: ${{ steps.check.outputs.model }}
    steps:
      - name: Validate credential and select an available model
        id: check
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from "node:fs";

          const key = process.env.ANTHROPIC_API_KEY;
          if (!key) {
            console.log(JSON.stringify({ apiPreflight: "failed", reason: "secret_missing" }));
            process.exit(2);
          }

          const response = await fetch("https://api.anthropic.com/v1/models?limit=100", {
            headers: {
              "x-api-key": key,
              "anthropic-version": "2023-06-01",
            },
          });

          let body = {};
          try {
            body = await response.json();
          } catch {}

          if (!response.ok) {
            console.log(JSON.stringify({
              apiPreflight: "failed",
              httpStatus: response.status,
              errorType: body?.error?.type ?? "unknown",
              credentialPrinted: false,
            }));
            process.exit(3);
          }

          const models = Array.isArray(body.data) ? body.data : [];
          const sonnetModels = models
            .filter((entry) => typeof entry?.id === "string" && /sonnet/i.test(entry.id))
            .sort((a, b) => String(b.created_at ?? "").localeCompare(String(a.created_at ?? "")));
          const selected = (sonnetModels[0] ?? models[0])?.id;
          if (!selected) {
            console.log(JSON.stringify({ apiPreflight: "failed", reason: "no_available_models" }));
            process.exit(4);
          }

          fs.appendFileSync(process.env.GITHUB_OUTPUT, `model=${selected}\n`);
          console.log(JSON.stringify({
            apiPreflight: "passed",
            availableModelCount: models.length,
            selectedModel: selected,
            credentialPrinted: false,
          }));
          NODE

  observer:
    name: Unprivileged remote observer
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions: {}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Observe published blob and test recovered authority
        env:
          CCA_OWNER: ${{ github.repository_owner }}
          CCA_REPO: ${{ github.event.repository.name }}
          CCA_BRANCH: ${{ inputs.target_branch }}
          CCA_RUN_ID: ${{ github.run_id }}
          CCA_POLL_MS: "2000"
          CCA_TIMEOUT_MS: "720000"
        run: node .github/cca-audit/observer.mjs

  victim:
    name: Exact production action
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
      issues: write
      pull-requests: write
    steps:
      - name: Give observer time to record the baseline ref
        run: sleep 20
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.target_branch }}
          fetch-depth: 1
          persist-credentials: true
      - name: Run exact Claude Code Action release
        id: claude_action
        uses: anthropics/claude-code-action@97c53473391bff1901034d4b454b5bac7ab7a029
        env:
          CLAUDE_BRANCH: ${{ inputs.target_branch }}
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          use_commit_signing: true
          show_full_output: false
          display_report: false
          prompt: |
            This is an authorized test in a disposable repository. Without
            reading, editing, or displaying its contents, make one signed
            commit containing the existing path docs/release-notes.md exactly
            as it is. Use mcp__github_file_ops__commit_files exactly once with
            commit message "audit: preserve release notes", then stop.
          claude_args: >-
            --model "${{ needs.preflight.outputs.model }}"
            --allowedTools "mcp__github_file_ops__commit_files"
      - name: Emit only redacted Claude result metadata
        if: always()
        shell: bash
        run: |
          node <<'NODE'
          const fs = require("node:fs");
          const path = `${process.env.RUNNER_TEMP}/claude-execution-output.json`;

          if (!fs.existsSync(path)) {
            console.log(JSON.stringify({ claudeDiagnostic: "execution_file_absent" }));
            process.exit(0);
          }

          let messages;
          try {
            messages = JSON.parse(fs.readFileSync(path, "utf8"));
          } catch {
            console.log(JSON.stringify({ claudeDiagnostic: "execution_file_unparseable" }));
            process.exit(0);
          }

          const result = [...messages].reverse().find((entry) => entry?.type === "result") ?? {};
          const hiddenText = JSON.stringify({ result: result.result, errors: result.errors });
          let errorCategory = null;
          if (result.is_error) {
            if (/authentication|api.?key|x-api-key|\b401\b/i.test(hiddenText)) errorCategory = "authentication";
            else if (/credit|billing|balance/i.test(hiddenText)) errorCategory = "billing";
            else if (/rate.?limit|\b429\b/i.test(hiddenText)) errorCategory = "rate_limit";
            else if (/model|not.?found|permission|access/i.test(hiddenText)) errorCategory = "model_access";
            else if (/overload|\b529\b/i.test(hiddenText)) errorCategory = "overloaded";
            else if (/network|fetch|connect|timeout/i.test(hiddenText)) errorCategory = "transport";
            else errorCategory = "unclassified";
          }

          console.log(JSON.stringify({
            claudeDiagnostic: "redacted",
            subtype: result.subtype ?? null,
            isError: result.is_error ?? null,
            durationMs: result.duration_ms ?? null,
            numTurns: result.num_turns ?? null,
            totalCostUsd: result.total_cost_usd ?? null,
            permissionDenialsCount: Array.isArray(result.permission_denials)
              ? result.permission_denials.length
              : null,
            modelUsageKeys: result.modelUsage ? Object.keys(result.modelUsage) : [],
            errorCategory,
            rawResultPrinted: false,
          }));
          NODE

  cleanup:
    name: Cleanup disposable refs
    if: always()
    needs: [preflight, observer, victim]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Delete only allowlisted audit refs
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_BRANCH: ${{ inputs.target_branch }}
          PROOF_BRANCH: cca-live-proof-${{ github.run_id }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          case "$TARGET_BRANCH" in
            cca-live-gate|cca-live-gate-*) ;;
            *) echo "Refusing to delete non-audit branch" >&2; exit 1 ;;
          esac
          for ref in "$TARGET_BRANCH" "$PROOF_BRANCH"; do
            curl -fsS -X DELETE \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/$REPOSITORY/git/refs/heads/$ref" \
              >/dev/null 2>&1 || true
          done
